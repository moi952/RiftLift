name: Build AppImage

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: scripts/build-appimage.sh "$RUNNER_TEMP/riftlift-appimage"
      - uses: actions/upload-artifact@v4
        with:
          name: riftlift-appimage
          path: ${{ runner.temp }}/riftlift-appimage/riftlift-*-x86_64.AppImage
